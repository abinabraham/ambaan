services:
  - type: web
    name: ambaan-api
    runtime: python
    rootDir: backend
    region: frankfurt
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health/
    domains:
      - api.ambaan.com
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: api.ambaan.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://app.ambaan.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://api.ambaan.com,https://app.ambaan.com
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: receipts
      - key: DJANGO_SUPERUSER_EMAIL
        value: abinabrahamcs@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
